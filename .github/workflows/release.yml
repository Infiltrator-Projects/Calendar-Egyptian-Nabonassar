name: Native C++ calendar qualification and release
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-calendar-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          submodules: recursive
      - name: Install C and C++ compilation and PDF prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential binutils pkg-config libglib2.0-dev libicu-dev gettext locales jq ghostscript zip
      - name: Qualify exact portable source and native installer with no Python
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(find . -name '*.py' -not -path './common/*' -print -quit)"
          bash common/calendar-tools/build.sh release
          files=(dist/*.deb); test "${#files[@]}" -eq 1
          bash common/calendar-tools/check-package.sh "${files[0]}" portable
          sudo bash common/calendar-tools/check-upgrade.sh "${files[0]}"
          installers=(dist/*.run); test "${#installers[@]}" -eq 1
          installer=$(realpath "${installers[0]}")
          "$installer" --help
          sudo "$installer" --profile aggressive --system-package-mode
          pkg=$(jq -r '"infiltrator-" + (.repository | ascii_downcase)' SOURCE-MANIFEST.json)
          name=$(jq -r '.name' SOURCE-MANIFEST.json)
          repo=$(jq -r '.repository' SOURCE-MANIFEST.json)
          test "$(dpkg-query -W -f='${Status}' "$pkg")" = 'install ok installed'
          test "$(dpkg-query -W -f='${Version}' "$pkg")" = "$(cat VERSION)+native1"
          test -f "/System/Resources/Calendars/$name.so"
          test -f "/System/Resources/Documentation/$repo/$name.pdf"
          test "$(dpkg-query -W -f='${X-Infiltrator-PGO}' "$pkg")" = 'trained-two-pass'
          test "$(dpkg-query -W -f='${X-Infiltrator-Resource-SHA256}' "$pkg")" = "$(sha256sum "/System/Resources/Calendars/$name.so" | cut -d' ' -f1)"
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 3
          jq -n --arg sha "$GITHUB_SHA" --arg version "$(cat VERSION)" --arg name "$name" --slurpfile assets <(for f in dist/*.deb dist/*.run dist/*.zip; do jq -n --arg file "$(basename "$f")" --arg hash "$(sha256sum "$f" | cut -d' ' -f1)" '{($file):$hash}'; done | jq -s 'add') \
            '{commit:$sha,version:$version,name:$name,assets:$assets[0]}' > dist/contract.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: calendar-qualified-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: qualify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          submodules: recursive
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: calendar-qualified-${{ github.sha }}
          path: release
      - name: Byte-verify and publish three native assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash common/clock-tools/publish.sh
